# configuration de jobwatch
# Copiez ce fichier vers config.yaml puis modifiez-le.
# Voir README.md pour la référence complète.

db: ~/.local/share/jobwatch/jobwatch.db

searches:
  - name: ai-engineer-paris
    include: ["AI engineer", "ingénieur IA", "machine learning", "LLM", "GenAI"]
    exclude: ["stage", "internship", "senior staff"]
    locations: ["Paris", "Île-de-France", "remote"]
    contract: permanent      # optionnel : permanent | fixed_term | internship | other

# sources : pour activer, supprimez la ligne « sources: {} » ci-dessous,
# puis décommentez et remplissez :
#   france_travail:
#     client_id: YOUR_CLIENT_ID          # identifiants d'application https://francetravail.io
#     client_secret: YOUR_CLIENT_SECRET
#     keywords: "ingénieur IA"           # requête côté serveur
#     department: "75"
#   smartrecruiters:
#     companies: [Wavestone1, Devoteam]
sources: {}

# notify : pour activer, supprimez la ligne « notify: {} » ci-dessous,
# puis décommentez et remplissez :
#   ntfy:
#     topic: your-private-topic          # optionnel ; POST https://ntfy.sh/<topic>
#   smtp:                                # optionnel
#     host: smtp.example.com
#     port: 587
#     user: you@example.com
#     password: app-password
#     to: you@example.com
notify: {}
