# Inclure dans le bloc http de nginx. Remplacer alice.jobs.example et 8801.
# Fournir les certificats avant activation.
# Charger nginx-common.conf une seule fois dans le bloc http.

server {
    listen 80;
    server_name alice.jobs.example;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name alice.jobs.example;
    ssl_certificate /etc/letsencrypt/live/alice.jobs.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alice.jobs.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 15m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn jobwatch_connections 12;
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering on;
    proxy_read_timeout 30s;
    location = /healthz { return 404; }
    location ~ ^/(login|invite/) {
        client_max_body_size 16k;
        limit_req zone=jobwatch_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8801;
    }
    location / {
        proxy_pass http://127.0.0.1:8801;
    }
}
