# Remplacer PUBLIC_IP avant installation. Le certificat doit déjà exister.
server {
    listen PUBLIC_IP:80 default_server;
    server_name "";
    return 404;
}

server {
    listen PUBLIC_IP:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen PUBLIC_IP:80;
    server_name jobwatch.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/jobwatch-acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen PUBLIC_IP:443 ssl;
    server_name jobwatch.cloud;
    ssl_certificate /etc/letsencrypt/live/jobwatch.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobwatch.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 15m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_conn jobwatch_connections 12;
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering on;
    proxy_read_timeout 40s;

    location = /healthz { return 404; }
    location ~ ^/(login|invite/) {
        client_max_body_size 16k;
        limit_req zone=jobwatch_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8810;
    }
    location / { proxy_pass http://127.0.0.1:8810; }
}
